services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: fdff_web
    restart: always
    ports:
      - '${WEB_PORT:-8080}:80'

  web-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: fdff_web_dev
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - '${VITE_PORT:-5173}:5173'
    volumes:
      - .:/app
      - /app/node_modules
