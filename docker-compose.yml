services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        # Empty: the app calls /api on its own origin. Set it only for a cross-origin API.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: fdff_web
    restart: always
    ports:
      - '${WEB_PORT:-8080}:80'

  web-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: fdff_web_dev
    restart: unless-stopped
    environment:
      # Vite runs inside this container; reach the API via the host-mapped port.
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://host.docker.internal:3000}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '${VITE_PORT:-5173}:5173'
    volumes:
      - .:/app
      - /app/node_modules
